<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>偉晟工業 生產日報系統</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'PingFang TC','Microsoft JhengHei',sans-serif;background:#f0f2f5;color:#222;min-height:100vh}
#nav{background:#1a3a5c;color:#fff;display:flex;align-items:stretch;flex-wrap:wrap}
#nav .logo{padding:14px 20px;font-size:16px;font-weight:700;border-right:1px solid rgba(255,255,255,0.1)}
#nav .logo span{font-size:11px;display:block;color:rgba(255,255,255,0.6);font-weight:400}
.nav-tabs{display:flex;flex:1;flex-wrap:wrap}
.nav-tab{padding:14px 16px;font-size:13px;cursor:pointer;color:rgba(255,255,255,0.7);border-bottom:3px solid transparent;transition:all 0.15s;white-space:nowrap}
.nav-tab:hover{color:#fff;background:rgba(255,255,255,0.05)}
.nav-tab.active{color:#fff;border-bottom-color:#4da6ff}
#content{max-width:1300px;margin:0 auto;padding:20px 16px}
.page{display:none}.page.active{display:block}
.page-title{font-size:18px;font-weight:700;margin-bottom:16px;color:#1a3a5c}
.card{background:#fff;border-radius:10px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,0.08)}
.card-title{font-size:14px;font-weight:700;color:#1a3a5c;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid #f0f0f0}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:11px;color:#888;font-weight:600}
.form-group input,.form-group select,.form-group textarea{border:1px solid #ddd;border-radius:6px;padding:7px 10px;font-size:13px;font-family:inherit;background:#fff;color:#222;transition:border 0.15s}
.form-group input:focus,.form-group select:focus{outline:none;border-color:#4da6ff;box-shadow:0 0 0 2px rgba(77,166,255,0.1)}
/* checkbox group */
.check-group{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.check-item{display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;background:#f5f7fa;border:1px solid #e0e0e0;border-radius:6px;padding:5px 10px;transition:all 0.15s}
.check-item:hover{border-color:#4da6ff;background:#f0f6ff}
.check-item input{width:14px;height:14px;cursor:pointer;accent-color:#1a3a5c}
.check-item.checked{background:#eef4ff;border-color:#4da6ff;color:#1a3a5c;font-weight:600}
/* buttons */
.btn{border:none;border-radius:6px;padding:8px 16px;font-size:13px;cursor:pointer;font-family:inherit;transition:all 0.15s;font-weight:500}
.btn-primary{background:#1a3a5c;color:#fff}.btn-primary:hover{background:#244d7a}
.btn-success{background:#2d7a3a;color:#fff}.btn-success:hover{background:#3a9649}
.btn-danger{background:#c0392b;color:#fff}.btn-danger:hover{background:#e74c3c}
.btn-warning{background:#d97706;color:#fff}.btn-warning:hover{background:#f59e0b}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-export{background:#217346;color:#fff}.btn-export:hover{background:#2a8f58}
.btn-add-row{background:#f0f6ff;border:1px dashed #4da6ff;color:#1a3a5c;border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer;margin-bottom:14px;transition:all 0.15s}
.btn-add-row:hover{background:#e0eeff}
/* table */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f5f7fa;color:#555;font-weight:600;padding:9px 10px;text-align:left;border-bottom:1px solid #e5e7eb;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
tr:hover td{background:#fafbff}
/* badge */
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.badge-blue{background:#dbeafe;color:#1d4ed8}
.badge-green{background:#dcfce7;color:#166534}
.badge-yellow{background:#fef9c3;color:#854d0e}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-gray{background:#f3f4f6;color:#4b5563}
/* progress */
.prog-wrap{width:100%;background:#e5e7eb;border-radius:4px;height:6px;min-width:60px}
.prog-fill{height:6px;border-radius:4px;background:#22c55e;transition:width 0.3s}
.prog-fill.warn{background:#f59e0b}
.prog-fill.danger{background:#ef4444}
/* row items in form */
.item-row{background:#f8fafc;border:1px solid #e8ecf0;border-radius:8px;padding:12px;margin-bottom:10px;position:relative}
.item-row-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.item-row-num{font-size:12px;font-weight:700;color:#1a3a5c;background:#dbeafe;padding:2px 8px;border-radius:10px}
/* filter */
.filter-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.filter-row .form-group{min-width:140px}
/* modal */
#modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center}
#modal-bg.open{display:flex}
#modal{background:#fff;border-radius:12px;padding:24px;width:90%;max-width:800px;max-height:90vh;overflow-y:auto}
#modal h3{font-size:16px;margin-bottom:16px;color:#1a3a5c}
.modal-footer{margin-top:16px;display:flex;gap:8px;justify-content:flex-end}
/* toast */
#toast{position:fixed;bottom:24px;right:24px;background:#1a3a5c;color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;opacity:0;transition:opacity 0.3s;z-index:200;pointer-events:none;max-width:300px}
#toast.show{opacity:1}
#toast.error{background:#c0392b}
.empty{text-align:center;color:#aaa;padding:40px;font-size:14px}
/* overview */
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.ov-card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,0.08);border-top:3px solid #4da6ff}
.ov-card.green{border-top-color:#22c55e}.ov-card.yellow{border-top-color:#f59e0b}.ov-card.red{border-top-color:#ef4444}
.ov-card .num{font-size:28px;font-weight:700;color:#1a3a5c}
.ov-card .lbl{font-size:12px;color:#888;margin-top:2px}
/* daily form report */
.daily-batch-section{background:#f0f6ff;border:1px solid #c7dff7;border-radius:8px;padding:14px;margin-bottom:14px}
.daily-batch-title{font-size:13px;font-weight:700;color:#1a3a5c;margin-bottom:10px}
</style>
</head>
<body>
<div id="nav">
  <div class="logo">偉晟工業<span>生產日報系統</span></div>
  <div class="nav-tabs">
    <div class="nav-tab active" onclick="showPage('overview',this)">📊 生管總覽</div>
    <div class="nav-tab" onclick="showPage('orders',this)">📋 生產流程單</div>
    <div class="nav-tab" onclick="showPage('assembly',this)">🌳 組樹日報</div>
    <div class="nav-tab" onclick="showPage('dewax',this)">🔥 脫蠟日報</div>
    <div class="nav-tab" onclick="showPage('casting',this)">⚙️ 鑄造日報</div>
    <div class="nav-tab" onclick="showPage('shipping',this)">🚚 出貨日報</div>
  </div>
</div>

<div id="content">

<!-- ══ 生管總覽 ══ -->
<div class="page active" id="page-overview">
  <div class="page-title">生管總覽</div>
  <div class="filter-row">
    <div class="form-group"><label>交貨日期篩選</label>
      <select id="ov-filter">
        <option value="all">全部</option>
        <option value="thisweek">本週到期</option>
        <option value="late">逾期未出貨</option>
      </select>
    </div>
    <div class="form-group"><label>搜尋批號/品名</label><input id="ov-search" placeholder="關鍵字" oninput="loadOverview()"></div>
    <button class="btn btn-primary" onclick="loadOverview()">查詢</button>
    <button class="btn btn-export" onclick="exportExcel()">📥 匯出 Excel</button>
  </div>
  <div class="ov-grid" id="ov-stats"></div>
  <div class="card">
    <div class="table-wrap">
      <table id="ov-table">
        <thead><tr>
          <th>批號</th><th>客戶</th><th>品名</th><th>規格</th><th>材質</th>
          <th>訂購量</th><th>交貨日</th>
          <th>組樹累計</th><th>脫蠟移出</th><th>鑄造良數</th><th>出貨累計</th>
          <th>出貨進度</th><th>狀態</th>
        </tr></thead>
        <tbody id="ov-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ══ 生產流程單 ══ -->
<div class="page" id="page-orders">
  <div class="page-title">生產流程單管理</div>
  <div class="card">
    <div class="card-title">新增流程單</div>
    <!-- 表頭 -->
    <div class="form-grid">
      <div class="form-group"><label>批號 *</label><input id="ord-batch" placeholder="如 416"></div>
      <div class="form-group"><label>客戶 *</label><input id="ord-customer" placeholder="如 QC"></div>
      <div class="form-group"><label>交貨日期</label><input id="ord-due" type="date"></div>
      <div class="form-group"><label>訂購日期</label><input id="ord-orderdate" type="date"></div>
    </div>
    <div style="margin-bottom:10px">
      <div style="font-size:11px;color:#888;font-weight:600;margin-bottom:6px">附件需求</div>
      <div class="check-group" id="chk-docs">
        <label class="check-item"><input type="checkbox" value="material_cert"> 材質證明</label>
        <label class="check-item"><input type="checkbox" value="heat_treat_report"> 熱處理報告</label>
        <label class="check-item"><input type="checkbox" value="dimension_report"> 尺寸報告</label>
      </div>
    </div>
    <div style="margin-bottom:14px">
      <div style="font-size:11px;color:#888;font-weight:600;margin-bottom:6px">熱處理方式</div>
      <div class="check-group" id="chk-heat">
        <label class="check-item"><input type="checkbox" value="solution_a"> 固溶化(A)</label>
        <label class="check-item"><input type="checkbox" value="solution_b"> 固溶化(B)</label>
        <label class="check-item"><input type="checkbox" value="anneal_b"> 退火(B)</label>
        <label class="check-item"><input type="checkbox" value="normalize_b"> 正常化(B)</label>
      </div>
    </div>
    <!-- 品項 -->
    <div class="card-title" style="margin-top:4px">品項明細</div>
    <div id="ord-items"></div>
    <button class="btn-add-row" onclick="addOrdItem()">＋ 新增品項</button>
    <div class="form-group" style="max-width:400px;margin-bottom:14px">
      <label>備註</label><textarea id="ord-note" rows="2" placeholder="備註"></textarea>
    </div>
    <button class="btn btn-success" onclick="saveOrder()">儲存流程單</button>
  </div>

  <!-- 查詢 -->
  <div class="card">
    <div class="filter-row">
      <div class="form-group"><label>搜尋</label><input id="ord-search" placeholder="批號/客戶/品名" oninput="loadOrders()"></div>
    </div>
    <div id="orders-list"></div>
  </div>
</div>

<!-- ══ 組樹日報 ══ -->
<div class="page" id="page-assembly">
  <div class="page-title">組樹日報表</div>
  <div class="card">
    <div class="form-grid" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr))">
      <div class="form-group"><label>日期 *</label><input type="date" id="asm-date"></div>
    </div>
    <div id="asm-rows"></div>
    <button class="btn-add-row" onclick="addDailyRow('asm')">＋ 新增行</button>
    <div class="form-group" style="max-width:400px;margin-bottom:14px">
      <label>備註</label><textarea id="asm-note" rows="2"></textarea>
    </div>
    <button class="btn btn-success" onclick="saveDailyReport('assembly')">儲存日報</button>
  </div>
  <div class="card">
    <div class="filter-row">
      <div class="form-group"><label>查詢日期</label><input type="date" id="asm-qdate"></div>
      <button class="btn btn-primary" onclick="loadDailyReport('assembly')">查詢</button>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>日期</th><th>批號</th><th>客戶</th><th>品名</th><th>規格</th><th>材質</th><th>串數</th><th>組樹數</th><th>總計</th><th>操作</th></tr></thead>
      <tbody id="asm-tbody"></tbody>
    </table></div>
  </div>
</div>

<!-- ══ 脫蠟日報 ══ -->
<div class="page" id="page-dewax">
  <div class="page-title">脫蠟日報表</div>
  <div class="card">
    <div class="form-grid">
      <div class="form-group"><label>日期 *</label><input type="date" id="dw-date"></div>
      <div class="form-group"><label>操作員</label><input id="dw-operator" placeholder="操作員"></div>
    </div>
    <div id="dw-rows"></div>
    <button class="btn-add-row" onclick="addDailyRow('dw')">＋ 新增行</button>
    <div class="form-group" style="max-width:400px;margin-bottom:14px">
      <label>備註</label><textarea id="dw-note" rows="2"></textarea>
    </div>
    <button class="btn btn-success" onclick="saveDailyReport('dewax')">儲存日報</button>
  </div>
  <div class="card">
    <div class="filter-row">
      <div class="form-group"><label>查詢日期</label><input type="date" id="dw-qdate"></div>
      <button class="btn btn-primary" onclick="loadDailyReport('dewax')">查詢</button>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>日期</th><th>批號</th><th>客戶</th><th>品名</th><th>規格</th><th>材質</th><th>操作員</th><th>收入數量</th><th>報廢數量</th><th>移出數量</th><th>操作</th></tr></thead>
      <tbody id="dw-tbody"></tbody>
    </table></div>
  </div>
</div>

<!-- ══ 鑄造日報 ══ -->
<div class="page" id="page-casting">
  <div class="page-title">鑄造日報表</div>
  <div class="card">
    <div class="form-grid">
      <div class="form-group"><label>日期 *</label><input type="date" id="cs-date"></div>
    </div>
    <div id="cs-rows"></div>
    <button class="btn-add-row" onclick="addDailyRow('cs')">＋ 新增行</button>
    <div class="form-group" style="max-width:400px;margin-bottom:14px">
      <label>備註</label><textarea id="cs-note" rows="2"></textarea>
    </div>
    <button class="btn btn-success" onclick="saveDailyReport('casting')">儲存日報</button>
  </div>
  <div class="card">
    <div class="filter-row">
      <div class="form-group"><label>查詢日期</label><input type="date" id="cs-qdate"></div>
      <button class="btn btn-primary" onclick="loadDailyReport('casting')">查詢</button>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>日期</th><th>客戶</th><th>爐次</th><th>批號</th><th>品名</th><th>材質</th><th>模頭號</th><th>良數</th><th>不良數</th><th>殼模溫度</th><th>鋼水溫度</th><th>操作</th></tr></thead>
      <tbody id="cs-tbody"></tbody>
    </table></div>
  </div>
</div>

<!-- ══ 出貨日報 ══ -->
<div class="page" id="page-shipping">
  <div class="page-title">出貨日報表</div>
  <div class="card">
    <div class="form-grid">
      <div class="form-group"><label>日期 *</label><input type="date" id="sh-date"></div>
    </div>
    <div id="sh-rows"></div>
    <button class="btn-add-row" onclick="addDailyRow('sh')">＋ 新增行</button>
    <div class="form-group" style="max-width:400px;margin-bottom:14px">
      <label>備註</label><textarea id="sh-note" rows="2"></textarea>
    </div>
    <button class="btn btn-success" onclick="saveDailyReport('shipping')">儲存日報</button>
  </div>
  <div class="card">
    <div class="filter-row">
      <div class="form-group"><label>查詢日期</label><input type="date" id="sh-qdate"></div>
      <button class="btn btn-primary" onclick="loadDailyReport('shipping')">查詢</button>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>日期</th><th>批號</th><th>客戶</th><th>商標</th><th>品名</th><th>材質</th><th>規格</th><th>數量</th><th>總計</th><th>件數</th><th>運送方式</th><th>操作</th></tr></thead>
      <tbody id="sh-tbody"></tbody>
    </table></div>
  </div>
</div>

</div><!-- /content -->

<!-- Modal -->
<div id="modal-bg">
  <div id="modal">
    <h3 id="modal-title">編輯</h3>
    <div id="modal-body"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-success" id="modal-save-btn">儲存</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const SURL='https://vxibeqpilbxrubgourjf.supabase.co';
const SKEY='sb_publishable_1tpzuvOZhMJfK1SWHxiM0A_PoJg5ccL';
const sb=supabase.createClient(SURL,SKEY);

function today(){return new Date().toISOString().slice(0,10);}
function toast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='show'+(type?' '+type:'');
  setTimeout(()=>t.className='',3000);
}

// ── NAV ──
function showPage(id,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  el.classList.add('active');
  if(id==='overview') loadOverview();
  if(id==='orders') loadOrders();
}

// ── CHECKBOX styling ──
document.querySelectorAll('.check-item input').forEach(cb=>{
  cb.addEventListener('change',()=>cb.closest('.check-item').classList.toggle('checked',cb.checked));
});

// ══════════════════════
// ORDERS
// ══════════════════════
let ordItemCount=0;
function addOrdItem(){
  const i=ordItemCount++;
  const html=`<div class="item-row" id="ord-item-${i}">
    <div class="item-row-header">
      <span class="item-row-num">品項 ${i+1}</span>
      <button class="btn btn-danger btn-sm" onclick="document.getElementById('ord-item-${i}').remove()">移除</button>
    </div>
    <div class="form-grid">
      <div class="form-group"><label>品名 *</label><input class="oi-product" placeholder="品名"></div>
      <div class="form-group"><label>商標</label><input class="oi-brand" placeholder="真/百"></div>
      <div class="form-group"><label>規格</label><input class="oi-spec" placeholder="規格"></div>
      <div class="form-group"><label>材質</label><input class="oi-material" placeholder="304/316..."></div>
      <div class="form-group"><label>模頭號</label><input class="oi-mold" placeholder="模頭號"></div>
      <div class="form-group"><label>一串幾個</label><input class="oi-perstring" type="number" placeholder="幾個"></div>
      <div class="form-group"><label>串數</label><input class="oi-strings" type="number" placeholder="串數"></div>
      <div class="form-group"><label>訂購量</label><input class="oi-orderqty" type="number" placeholder="訂購量"></div>
      <div class="form-group"><label>生產量</label><input class="oi-prodqty" type="number" placeholder="生產量"></div>
    </div>
  </div>`;
  document.getElementById('ord-items').insertAdjacentHTML('beforeend',html);
}

async function saveOrder(){
  const batch=document.getElementById('ord-batch').value.trim();
  const customer=document.getElementById('ord-customer').value.trim();
  if(!batch||!customer){toast('請填寫批號和客戶','error');return;}
  const docs=[...document.querySelectorAll('#chk-docs input:checked')].map(c=>c.value);
  const heat=[...document.querySelectorAll('#chk-heat input:checked')].map(c=>c.value);
  const orderRow={
    batch_no:batch, customer,
    due_date:document.getElementById('ord-due').value||null,
    order_date:document.getElementById('ord-orderdate').value||null,
    docs_required:docs, heat_treatment:heat,
    note:document.getElementById('ord-note').value.trim(),
    created_at:new Date().toISOString()
  };
  const {data:ord,error:e1}=await sb.from('orders').insert(orderRow).select().single();
  if(e1){toast('儲存失敗: '+e1.message,'error');return;}
  // items
  const itemEls=document.querySelectorAll('#ord-items .item-row');
  if(itemEls.length===0){toast('請至少新增一個品項','error');return;}
  const items=[...itemEls].map(row=>({
    order_id:ord.id, batch_no:batch, customer,
    product_name:row.querySelector('.oi-product').value.trim(),
    brand:row.querySelector('.oi-brand').value.trim(),
    spec:row.querySelector('.oi-spec').value.trim(),
    material:row.querySelector('.oi-material').value.trim(),
    mold_no:row.querySelector('.oi-mold').value.trim(),
    per_string:parseInt(row.querySelector('.oi-perstring').value)||null,
    string_count:parseInt(row.querySelector('.oi-strings').value)||null,
    order_qty:parseInt(row.querySelector('.oi-orderqty').value)||null,
    prod_qty:parseInt(row.querySelector('.oi-prodqty').value)||null,
    due_date:document.getElementById('ord-due').value||null
  })).filter(r=>r.product_name);
  if(items.length===0){toast('請填寫品名','error');return;}
  const {error:e2}=await sb.from('order_items').insert(items);
  if(e2){toast('品項儲存失敗: '+e2.message,'error');return;}
  toast('✅ 流程單已儲存');
  document.getElementById('ord-batch').value='';
  document.getElementById('ord-customer').value='';
  document.getElementById('ord-due').value='';
  document.getElementById('ord-orderdate').value='';
  document.getElementById('ord-note').value='';
  document.getElementById('ord-items').innerHTML='';
  document.querySelectorAll('#chk-docs input,#chk-heat input').forEach(c=>{c.checked=false;c.closest('.check-item').classList.remove('checked');});
  ordItemCount=0;
  loadOrders();
}

async function loadOrders(){
  const q=document.getElementById('ord-search').value.trim();
  let query=sb.from('orders').select('*, order_items(*)').order('created_at',{ascending:false});
  if(q) query=query.or(`batch_no.ilike.%${q}%,customer.ilike.%${q}%`);
  const {data,error}=await query;
  if(error){toast('載入失敗','error');return;}
  const el=document.getElementById('orders-list');
  if(!data||data.length===0){el.innerHTML='<div class="empty">尚無流程單</div>';return;}
  el.innerHTML=data.map(ord=>{
    const docLabels={material_cert:'材質證明',heat_treat_report:'熱處理報告',dimension_report:'尺寸報告'};
    const heatLabels={solution_a:'固溶化(A)',solution_b:'固溶化(B)',anneal_b:'退火(B)',normalize_b:'正常化(B)'};
    const docBadges=(ord.docs_required||[]).map(d=>`<span class="badge badge-blue">${docLabels[d]||d}</span>`).join(' ');
    const heatBadges=(ord.heat_treatment||[]).map(h=>`<span class="badge badge-yellow">${heatLabels[h]||h}</span>`).join(' ');
    const itemRows=(ord.order_items||[]).map(it=>`
      <tr>
        <td>${it.product_name}</td><td>${it.brand||''}</td><td>${it.spec||''}</td>
        <td>${it.material||''}</td><td>${it.mold_no||''}</td>
        <td>${it.per_string||''}</td><td>${it.string_count||''}</td>
        <td>${it.order_qty||''}</td><td>${it.prod_qty||''}</td>
        <td style="display:flex;gap:4px">
          <button class="btn btn-danger btn-sm" onclick="deleteItem('${it.id}','${ord.id}')">刪除</button>
        </td>
      </tr>`).join('');
    return `<div class="card" style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:10px">
        <div>
          <span style="font-size:16px;font-weight:700;color:#1a3a5c">批號 ${ord.batch_no}</span>
          <span style="margin-left:10px;color:#555">${ord.customer}</span>
          ${ord.due_date?`<span style="margin-left:10px;font-size:12px;color:#888">交期：${ord.due_date}</span>`:''}
        </div>
        <div style="display:flex;gap:6px">
          <button class="btn btn-warning btn-sm" onclick="editOrder('${ord.id}')">編輯表頭</button>
          <button class="btn btn-primary btn-sm" onclick="addItemToOrder('${ord.id}','${ord.batch_no}','${ord.customer}','${ord.due_date||''}')">＋ 品項</button>
          <button class="btn btn-danger btn-sm" onclick="deleteOrder('${ord.id}')">刪除整張</button>
        </div>
      </div>
      <div style="margin-bottom:8px;display:flex;gap:6px;flex-wrap:wrap">${docBadges}${heatBadges}</div>
      <div class="table-wrap"><table>
        <thead><tr><th>品名</th><th>商標</th><th>規格</th><th>材質</th><th>模頭號</th><th>一串幾個</th><th>串數</th><th>訂購量</th><th>生產量</th><th>操作</th></tr></thead>
        <tbody>${itemRows}</tbody>
      </table></div>
      ${ord.note?`<div style="margin-top:8px;font-size:12px;color:#888">備註：${ord.note}</div>`:''}
    </div>`;
  }).join('');
}

async function deleteOrder(id){
  if(!confirm('確定刪除整張流程單（含所有品項）？')) return;
  await sb.from('order_items').delete().eq('order_id',id);
  await sb.from('orders').delete().eq('id',id);
  toast('已刪除'); loadOrders();
}

async function deleteItem(itemId, ordId){
  if(!confirm('確定刪除此品項？')) return;
  await sb.from('order_items').delete().eq('id',itemId);
  toast('已刪除'); loadOrders();
}

async function editOrder(id){

  if(!data) return;
  const docLabels=[['material_cert','材質證明'],['heat_treat_report','熱處理報告'],['dimension_report','尺寸報告']];
  const heatLabels=[['solution_a','固溶化(A)'],['solution_b','固溶化(B)'],['anneal_b','退火(B)'],['normalize_b','正常化(B)']];

  openModal();

function buildItemOptions(items,selectedId=''){
  return `<option value="">— 選擇品項 —</option>`+items.map(it=>`<option value="${it.id}" data-product="${it.product_name}" data-spec="${it.spec||''}" data-material="${it.material||''}" data-brand="${it.brand||''}" data-strings="${it.string_count||''}" data-mold="${it.mold_no||''}" ${it.id===selectedId?'selected':''}>${it.product_name} ${it.spec?'/ '+it.spec:''} ${it.material?'('+it.material+')':''}</option>`).join('');
}

async function onBatchChange(input, prefix, i){
  const batch=input.value.trim();
  const row=document.getElementById(prefix+'-row-'+i);
  if(!row) return;
  const sel=row.querySelector('.row-item-sel');
  if(!sel) return;
  if(!batch){sel.innerHTML='<option>先輸入批號</option>';return;}
  sel.innerHTML='<option>載入中...</option>';
  const items=await getBatchItems(batch);
  sel.innerHTML=buildItemOptions(items);
  // auto fill customer
  if(items.length>0){
    const custEl=row.querySelector('.row-cust');
    if(custEl) custEl.value=items[0].customer||'';
  }
}

function onItemSelect(sel, prefix, i){
  const opt=sel.options[sel.selectedIndex];
  if(!opt||!opt.value) return;
  const row=document.getElementById(prefix+'-row-'+i);
  const set=(cls,attr)=>{const el=row.querySelector('.row-'+cls);if(el) el.value=opt.dataset[attr]||'';};
  set('product','product'); set('spec','spec'); set('material','material');
  set('brand','brand'); set('strings','strings'); set('mold','mold');
}

async function saveDailyReport(type){
  const prefixMap={assembly:'asm',dewax:'dw',casting:'cs',shipping:'sh'};
  const tableMap={assembly:'assembly_reports',dewax:'dewax_reports',casting:'casting_reports',shipping:'shipping_reports'};
  const prefix=prefixMap[type];
  const dateVal=document.getElementById(prefix+'-date').value;
  if(!dateVal){toast('請選擇日期','error');return;}
  const rows=[];
  document.querySelectorAll('#'+prefix+'-rows .item-row').forEach(row=>{
    const g=cls=>row.querySelector('.row-'+cls)?.value.trim()||'';
    const itemSel=row.querySelector('.row-item-sel');
    const itemId=itemSel?.value||null;
    const base={report_date:dateVal,batch_no:g('batch'),item_id:itemId,customer:g('cust'),product_name:g('product')};
    if(!base.batch_no&&!base.product_name) return;
    if(type==='assembly') rows.push({...base,spec:g('spec'),material:g('material'),string_count:parseInt(g('strings'))||null,assembly_count:parseInt(g('assembly'))||null,total:parseInt(g('total'))||null,note:document.getElementById('asm-note').value});
    else if(type==='dewax') rows.push({...base,spec:g('spec'),material:g('material'),operator:document.getElementById('dw-operator').value,qty_in:g('in'),qty_scrap:g('scrap'),qty_out:g('out'),note:document.getElementById('dw-note').value});
    else if(type==='casting') rows.push({...base,material:g('material'),furnace_no:g('furnace'),mold_no:g('mold'),good_count:g('good'),bad_count:g('bad'),shell_temp:g('shell'),water_temp:g('water'),note:document.getElementById('cs-note').value});
    else if(type==='shipping') rows.push({...base,brand:g('brand'),material:g('material'),spec:g('spec'),quantity:g('qty'),total:g('total'),pieces:g('pieces'),transport:g('transport'),note:document.getElementById('sh-note').value});
  });
  if(rows.length===0){toast('請至少新增一行','error');return;}
  const {error}=await sb.from(tableMap[type]).insert(rows);
  if(error){toast('儲存失敗: '+error.message,'error');console.error(error);return;}
  toast('✅ 日報已儲存');
  document.getElementById(prefix+'-rows').innerHTML='';
  loadDailyReport(type);
}

// LOAD DAILY REPORTS
// ══════════════════════
async function loadDailyReport(type){
  const prefixMap={assembly:'asm',dewax:'dw',casting:'cs',shipping:'sh'};
  const tableMap={assembly:'assembly_reports',dewax:'dewax_reports',casting:'casting_reports',shipping:'shipping_reports'};
  const prefix=prefixMap[type];
  const dateVal=document.getElementById(prefix+'-qdate').value;
  let q=sb.from(tableMap[type]).select('*').order('report_date',{ascending:false}).limit(300);
  if(dateVal) q=q.eq('report_date',dateVal);
  const {data,error}=await q;
  if(error){toast('載入失敗','error');return;}
  const tbody=document.getElementById(prefix+'-tbody');
  if(!data||data.length===0){tbody.innerHTML='<tr><td colspan="12" class="empty">尚無資料</td></tr>';return;}
  const editBtn=(table,id,cb)=>`<button class="btn btn-warning btn-sm" onclick="editReport('${table}','${id}','${cb}')">編輯</button>`;
  const delBtn=(table,id,cb)=>`<button class="btn btn-danger btn-sm" onclick="deleteReport('${table}','${id}','${cb}')">刪除</button>`;
  if(type==='assembly'){
    tbody.innerHTML=data.map(r=>`<tr><td>${r.report_date}</td><td>${r.batch_no||''}</td><td>${r.customer||''}</td><td>${r.product_name||''}</td><td>${r.spec||''}</td><td>${r.material||''}</td><td>${r.string_count||''}</td><td>${r.assembly_count||''}</td><td>${r.total||''}</td><td style="display:flex;gap:4px">${editBtn('assembly_reports',r.id,'assembly')}${delBtn('assembly_reports',r.id,'assembly')}</td></tr>`).join('');
  } else if(type==='dewax'){
    tbody.innerHTML=data.map(r=>`<tr><td>${r.report_date}</td><td>${r.batch_no||''}</td><td>${r.customer||''}</td><td>${r.product_name||''}</td><td>${r.spec||''}</td><td>${r.material||''}</td><td>${r.operator||''}</td><td>${r.qty_in||''}</td><td>${r.qty_scrap||''}</td><td>${r.qty_out||''}</td><td style="display:flex;gap:4px">${editBtn('dewax_reports',r.id,'dewax')}${delBtn('dewax_reports',r.id,'dewax')}</td></tr>`).join('');
  } else if(type==='casting'){

async function deleteReport(table,id,type){
  if(!confirm('確定刪除？')) return;
  await sb.from(table).delete().eq('id',id);
  toast('已刪除'); loadDailyReport(type);
}

async function editReport(table,id,type){
  const {data}=await sb.from(table).select('*').eq('id',id).single();
  if(!data) return;
  const fieldMap={
    assembly_reports:[['report_date','日期','date'],['batch_no','批號','text'],['customer','客戶','text'],['product_name','品名','text'],['spec','規格','text'],['material','材質','text'],['string_count','串數','number'],['assembly_count','組樹數','number'],['total','總計','number']],
    dewax_reports:[['report_date','日期','date'],['batch_no','批號','text'],['customer','客戶','text'],['product_name','品名','text'],['spec','規格','text'],['material','材質','text'],['operator','操作員','text'],['qty_in','收入','text'],['qty_scrap','報廢','text'],['qty_out','移出','text']],
    casting_reports:[['report_date','日期','date'],['customer','客戶','text'],['furnace_no','爐次','text'],['batch_no','批號','text'],['product_name','品名','text'],['material','材質','text'],['mold_no','模頭號','text'],['good_count','良數','text'],['bad_count','不良數','text'],['shell_temp','殼模溫度','text'],['water_temp','鋼水溫度','text']],
    shipping_reports:[['report_date','日期','date'],['batch_no','批號','text'],['customer','客戶','text'],['brand','商標','text'],['product_name','品名','text'],['material','材質','text'],['spec','規格','text'],['quantity','數量','text'],['total','總計','text'],['pieces','件數','text'],['transport','運送方式','text']]
  };
  const fs=fieldMap[table]||[];
  document.getElementById('modal-title').textContent='編輯資料';
  document.getElementById('modal-body').innerHTML=`<div class="form-grid">${fs.map(([k,l,t])=>`<div class="form-group"><label>${l}</label><input id="ef-${k}" type="${t}" value="${data[k]||''}"></div>`).join('')}</div>`;
  document.getElementById('modal-save-btn').onclick=async()=>{
    const updates={};
    fs.forEach(([k])=>{updates[k]=document.getElementById('ef-'+k).value||null;});
    await sb.from(table).update(updates).eq('id',id);
    toast('✅ 已更新'); closeModal(); loadDailyReport(type);
  };
  openModal();
}

// ══════════════════════
// OVERVIEW
// ══════════════════════
async function loadOverview(){
  const filter=document.getElementById('ov-filter').value;
  const search=document.getElementById('ov-search').value.trim();
  const todayStr=today();
  const weekEnd=new Date(); weekEnd.setDate(weekEnd.getDate()+7);
  const weekEndStr=weekEnd.toISOString().slice(0,10);

  const [{data:items},{data:asm},{data:dw},{data:cs},{data:sh}]=await Promise.all([
    sb.from('order_items').select('*, orders(batch_no,customer,due_date,docs_required,heat_treatment)'),
    sb.from('assembly_reports').select('item_id,assembly_count,batch_no,product_name'),
    sb.from('dewax_reports').select('item_id,qty_out,batch_no,product_name'),
    sb.from('casting_reports').select('item_id,good_count,batch_no,product_name'),
    sb.from('shipping_reports').select('item_id,quantity,batch_no,product_name'),
  ]);

  // build maps: item_id → sum
  const sumMap=(arr,key)=>{
    const m={};
    (arr||[]).forEach(r=>{
      const id=r.item_id||('b_'+r.batch_no+'_'+r.product_name);
      const v=parseFloat(r[key])||0;
      m[id]=(m[id]||0)+v;
    });
    return m;
  };
  const asmMap=sumMap(asm,'assembly_count');
  const dwMap=sumMap(dw,'qty_out');
  const csMap=sumMap(cs,'good_count');
  const shMap=sumMap(sh,'quantity');

  let filtered=(items||[]).filter(it=>{
    if(search && !it.batch_no?.includes(search) && !it.product_name?.includes(search) && !it.orders?.customer?.includes(search)) return false;
    if(filter==='thisweek' && it.due_date){return it.due_date>=todayStr && it.due_date<=weekEndStr;}
    if(filter==='late' && it.due_date){return it.due_date<todayStr && (shMap[it.id]||0)<(it.order_qty||1);}
    return true;
  });

  // stats
  const total=filtered.length;
  const done=filtered.filter(it=>(shMap[it.id]||0)>=(it.order_qty||1)).length;
  const late=filtered.filter(it=>it.due_date&&it.due_date<todayStr&&(shMap[it.id]||0)<(it.order_qty||1)).length;
  document.getElementById('ov-stats').innerHTML=`
    <div class="ov-card"><div class="num">${total}</div><div class="lbl">品項總數</div></div>
    <div class="ov-card green"><div class="num">${done}</div><div class="lbl">已完成出貨</div></div>
    <div class="ov-card yellow"><div class="num">${total-done-late}</div><div class="lbl">進行中</div></div>
    <div class="ov-card red"><div class="num">${late}</div><div class="lbl">逾期未出貨</div></div>`;

  const tbody=document.getElementById('ov-tbody');
  if(!filtered.length){tbody.innerHTML='<tr><td colspan="13" class="empty">尚無資料</td></tr>';return;}
  tbody.innerHTML=filtered.map(it=>{
    const id=it.id;
    const asmV=asmMap[id]||0;
    const dwV=dwMap[id]||0;
    const csV=csMap[id]||0;
    const shV=shMap[id]||0;
    const orderQty=it.order_qty||0;
    const pct=orderQty>0?Math.min(100,Math.round(shV/orderQty*100)):0;
    const isLate=it.due_date&&it.due_date<todayStr&&shV<orderQty;
    const isDone=orderQty>0&&shV>=orderQty;
    const status=isDone?'<span class="badge badge-green">完成</span>':isLate?'<span class="badge badge-red">逾期</span>':asmV>0?'<span class="badge badge-yellow">進行中</span>':'<span class="badge badge-gray">未開始</span>';
    const progClass=pct>=100?'':pct>=50?'warn':'danger';
    return `<tr style="${isLate&&!isDone?'background:#fff8f8':''}">
      <td><b>${it.batch_no||''}</b></td>
      <td>${it.orders?.customer||it.customer||''}</td>
      <td>${it.product_name||''}</td>
      <td>${it.spec||''}</td><td>${it.material||''}</td>
      <td>${orderQty||''}</td>
      <td>${it.orders?.due_date||it.due_date||''}</td>
      <td>${asmV||'—'}</td><td>${dwV||'—'}</td><td>${csV||'—'}</td>
      <td><b>${shV||'—'}</b></td>
      <td><div class="prog-wrap"><div class="prog-fill ${progClass}" style="width:${pct}%"></div></div><span style="font-size:11px;color:#888">${pct}%</span></td>
      <td>${status}</td>
    </tr>`;
  }).join('');
}

async function exportExcel(){
  const [{data:items},{data:orders},{data:asm},{data:dw},{data:cs},{data:sh}]=await Promise.all([
    sb.from('order_items').select('*'),
    sb.from('orders').select('*'),
    sb.from('assembly_reports').select('*'),
    sb.from('dewax_reports').select('*'),
    sb.from('casting_reports').select('*'),
    sb.from('shipping_reports').select('*'),
  ]);
  const wb=XLSX.utils.book_new();
  const toSheet=(data,headers,keys)=>XLSX.utils.aoa_to_sheet([headers,...(data||[]).map(r=>keys.map(k=>r[k]??''))]);
  XLSX.utils.book_append_sheet(wb,toSheet(items,['批號','客戶','品名','商標','規格','材質','模頭號','一串幾個','串數','訂購量','生產量'],['batch_no','customer','product_name','brand','spec','material','mold_no','per_string','string_count','order_qty','prod_qty']),'品項');
  XLSX.utils.book_append_sheet(wb,toSheet(asm,['日期','批號','客戶','品名','規格','材質','串數','組樹數','總計'],['report_date','batch_no','customer','product_name','spec','material','string_count','assembly_count','total']),'組樹');
  XLSX.utils.book_append_sheet(wb,toSheet(dw,['日期','批號','客戶','品名','規格','材質','操作員','收入','報廢','移出'],['report_date','batch_no','customer','product_name','spec','material','operator','qty_in','qty_scrap','qty_out']),'脫蠟');
  XLSX.utils.book_append_sheet(wb,toSheet(cs,['日期','客戶','爐次','批號','品名','材質','模頭號','良數','不良數','殼模溫度','鋼水溫度'],['report_date','customer','furnace_no','batch_no','product_name','material','mold_no','good_count','bad_count','shell_temp','water_temp']),'鑄造');
  XLSX.utils.book_append_sheet(wb,toSheet(sh,['日期','批號','客戶','商標','品名','材質','規格','數量','總計','件數','運送方式'],['report_date','batch_no','customer','brand','product_name','material','spec','quantity','total','pieces','transport']),'出貨');
  XLSX.writeFile(wb,`偉晟生產日報_${today()}.xlsx`);
  toast('✅ Excel 已下載');
}
